name: Uptime Check

on:
  schedule:
    # Run every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Uptime-Pulse Health Check
        run: |
          curl -X GET "https://${{ secrets.APP_DOMAIN }}/api/check" \
          -H "Authorization: Bearer ${{ secrets.API_SECRET }}"
